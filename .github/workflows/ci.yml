name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up Node (for the built CLI smoke test)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck (strict)
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Build
        run: bun run build

      - name: Smoke test the built CLI
        run: |
          node dist/cli.js parse examples/cluster-metrics.txt > /dev/null
          node dist/cli.js aggregate examples/cluster-metrics.txt --by service --agg sum | grep -q 'http_requests_total{service="api"}'
          node dist/cli.js parse examples/cluster-metrics.txt --strict
